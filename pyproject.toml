[project]
dependencies = [] # Consider listing explicit dependencies here too
description = "Add a short description here"
name = "metazebrobot"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
metazebrobot = "metazebrobot.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# Only one instance of this section needed
[tool.hatch.build]
packages = ["src/metazebrobot"]

# --- Keep your pixi sections below ---
[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
metazebrobot = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pyside6 = ">=6.8.1,<7"
pydantic = ">=2.10.5,<3"
numpy = ">=2.2.3,<3"
rich = ">=13.9.4,<14"
requests = ">=2.32.3,<3"
certifi = ">=2025.1.31,<2026"
bs4 = ">=4.13.3,<5"
cryptography = ">=44.0.2,<45"
jupyterlab = ">=4.3.5,<5"
lifelines = ">=0.30.0,<0.31"
polars = ">=1.26.0,<2"
# It's good practice to also list your build backend here for pixi
hatchling = "*"