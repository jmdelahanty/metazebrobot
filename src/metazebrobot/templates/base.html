<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MetaZebrobot{% endblock %}</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <script src="/static/htmx.min.js"></script>
    <style>
        .flash { padding: 0.75rem 1rem; border-radius: var(--pico-border-radius); margin-bottom: 1rem; }
        .flash-success { background: var(--pico-ins-color); }
        .flash-error { background: var(--pico-del-color); }
        .screening-steps-table { font-size: 0.9rem; }
        .protocol-box { background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); padding: 1rem; margin-bottom: 1rem; }
        .indicator-images { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .indicator-thumb { margin: 0; max-width: 320px; }
        .indicator-thumb img { border-radius: var(--pico-border-radius); max-height: 240px; width: auto; }
        .indicator-thumb figcaption { font-size: 0.8rem; text-align: center; }
        .gallery-grid { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
        .gallery-thumb { margin: 0; max-width: 280px; }
        .gallery-thumb img { border-radius: var(--pico-border-radius); max-height: 200px; width: auto; cursor: pointer; }
        .gallery-thumb img:hover { opacity: 0.8; }
        .gallery-thumb figcaption { font-size: 0.8rem; text-align: center; }
        .image-gallery { margin-top: 0.5rem; padding: 0.75rem; background: var(--pico-card-background-color); border-radius: var(--pico-border-radius); }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><strong>MetaZebrobot</strong></li>
        </ul>
        <ul>
            <li><a href="/screening/">Screening</a></li>
            <li><a href="/health">API Health</a></li>
            <!-- Fish management is accessed per-dish via /dishes/{dish_id}/fish/ -->
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
