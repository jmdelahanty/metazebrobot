<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MetaZebrobot{% endblock %}</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/driver.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/driver.js.iife.js"></script>
    <script src="/static/walkthrough.js"></script>
    <style>
        .flash { padding: 0.75rem 1rem; border-radius: var(--pico-border-radius); margin-bottom: 1rem; }
        .flash-success { background: var(--pico-ins-color); }
        .flash-error { background: var(--pico-del-color); }
        .screening-steps-table { font-size: 0.9rem; }
        .protocol-box { background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); padding: 1rem; margin-bottom: 1rem; }
        .indicator-images { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .indicator-thumb { margin: 0; max-width: 320px; }
        .indicator-thumb img { border-radius: var(--pico-border-radius); max-height: 240px; width: auto; }
        .indicator-thumb figcaption { font-size: 0.8rem; text-align: center; }
        .atlas-thumb { margin: 0; max-width: 480px; }
        .atlas-thumb img { border-radius: var(--pico-border-radius); max-height: 360px; width: auto; }
        .atlas-thumb figcaption { font-size: 0.8rem; text-align: center; }
        .gallery-grid { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
        .gallery-thumb { margin: 0; max-width: 280px; }
        .gallery-thumb img { border-radius: var(--pico-border-radius); max-height: 200px; width: auto; cursor: pointer; }
        .gallery-thumb img:hover { opacity: 0.8; }
        .gallery-thumb figcaption { font-size: 0.8rem; text-align: center; }
        .image-gallery { margin-top: 0.5rem; padding: 0.75rem; background: var(--pico-card-background-color); border-radius: var(--pico-border-radius); }
        /* Plate map */
        .plate-map { margin-bottom: 1.5rem; }
        .plate-grid { display: inline-grid; gap: 4px; }
        .plate-col-headers { display: contents; }
        .plate-col-header { text-align: center; font-weight: bold; font-size: 0.8rem; padding: 0.15rem 0; color: var(--pico-muted-color); }
        .plate-row-label { display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85rem; color: var(--pico-muted-color); padding-right: 0.25rem; }
        .plate-well { border: 2px solid var(--pico-muted-border-color); border-radius: 6px; padding: 0.3rem; min-width: 4.5rem; min-height: 3.5rem; text-align: center; font-size: 0.75rem; display: flex; flex-direction: column; justify-content: center; }
        .plate-well--occupied { background: #d4edda; border-color: #8bc49a; }
        .plate-well--empty { background: var(--pico-card-background-color); }
        .plate-well__label { font-weight: bold; font-size: 0.7rem; color: var(--pico-muted-color); }
        .plate-well__fish { font-size: 0.8rem; margin-top: 0.15rem; word-break: break-all; }
        .unassigned-list { margin-top: 1rem; }
        .transgene-block { margin: 0.5rem 0 1rem; }
        .transgene-table { margin-top: 0.35rem; }
        .transgene-table td, .transgene-table th { font-size: 0.8rem; white-space: nowrap; }
        .screening-step-detail-row td { background: var(--pico-card-background-color); }
        .screening-step-action-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 0.75rem; }
        .screening-step-action-panel { padding: 0.9rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); background: var(--pico-background-color); }
        .screening-step-action-panel h6 { margin-bottom: 0.35rem; }
        /* PyRAT age status */
        .age-urgent { background: #ffc8c8 !important; }
        .age-warning { background: #ffffc8 !important; }
        .age-ok { background: #c8ffc8 !important; }
        .age-unknown { background: #f0f0f0 !important; }
        tr.age-urgent td, tr.age-warning td, tr.age-ok td, tr.age-unknown td { background: inherit !important; }
        /* PyRAT crossing status */
        tr.crossing-raised, tr.crossing-raised td { background: #c8ffc8 !important; }
        tr.crossing-setup, tr.crossing-setup td { background: #c8dcff !important; }
        tr.crossing-recorded, tr.crossing-recorded td { background: #ffffc8 !important; }
        tr.crossing-discarded, tr.crossing-discarded td { background: #f0f0f0 !important; }
        /* Sortable table headers */
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { text-decoration: underline; }
        th.sort-asc::after { content: " \25b2"; font-size: 0.7rem; }
        th.sort-desc::after { content: " \25bc"; font-size: 0.7rem; }
    </style>
</head>
<body>
    <nav class="container-fluid">
        <ul>
            <li><a href="/"><strong>MetaZebrobot</strong></a></li>
        </ul>
        <ul>
            <li><a href="/dishes/">Dishes</a></li>
            <li><a href="/screening/">Screening</a></li>
            <li><a href="/care/">Care</a></li>
            <li><a href="/fish/">Fish</a></li>
            <li><a href="/references/">References</a></li>
            <li><a href="/pyrat/tanks/">PyRAT Tanks</a></li>
            <li><a href="/pyrat/crossings/">PyRAT Crossings</a></li>
            <li><a href="#" onclick="startWalkthrough(); return false;" style="font-size:0.85rem">Tour</a></li>
            <li>
                <form action="/set-user" method="post" style="margin:0; display:inline">
                    <select name="username" onchange="this.form.submit()" style="padding:0.25rem 0.5rem; font-size:0.8rem; width:auto; margin:0;">
                        {% for u in user_list %}
                        <option value="{{ u }}"{% if u == current_user %} selected{% endif %}>{{ u }}</option>
                        {% endfor %}
                        {% if current_user and current_user not in user_list %}
                        <option value="{{ current_user }}" selected>{{ current_user }}</option>
                        {% endif %}
                    </select>
                </form>
            </li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Scan input handler
        var el = document.getElementById("scan-input");
        if (el) {
            el.addEventListener("keydown", function(e) {
                if (e.key === "Enter" && this.value.trim()) {
                    window.location.href = this.dataset.navigate + encodeURIComponent(this.value.trim());
                }
            });
        }

        // Sortable table columns
        var naturalCollator = new Intl.Collator(undefined, {
            numeric: true,
            sensitivity: "base"
        });
        document.querySelectorAll("th.sortable").forEach(function(th) {
            th.addEventListener("click", function() {
                var table = th.closest("table");
                var tbody = table.querySelector("tbody");
                var colIdx = Array.from(th.parentNode.children).indexOf(th);
                var rows = Array.from(tbody.querySelectorAll("tr"));
                var isAsc = th.classList.contains("sort-asc");

                // Clear all sort indicators
                table.querySelectorAll("th.sortable").forEach(function(h) {
                    h.classList.remove("sort-asc", "sort-desc");
                });

                rows.sort(function(a, b) {
                    var aCell = a.children[colIdx];
                    var bCell = b.children[colIdx];
                    var aVal = aCell.dataset.sortValue || aCell.textContent.trim();
                    var bVal = bCell.dataset.sortValue || bCell.textContent.trim();
                    var aNum = Number(aVal);
                    var bNum = Number(bVal);
                    var comparison;
                    if (aVal !== "" && bVal !== "" && Number.isFinite(aNum) && Number.isFinite(bNum)) {
                        comparison = aNum - bNum;
                    } else {
                        comparison = naturalCollator.compare(aVal, bVal);
                    }
                    return isAsc ? -comparison : comparison;
                });

                th.classList.add(isAsc ? "sort-desc" : "sort-asc");
                rows.forEach(function(r) { tbody.appendChild(r); });
            });
        });
    });
    </script>
</body>
</html>
