{# Reusable partial: display parsed constructs as a compact normalized table #}
{% if transgenes %}
<section class="transgene-block">
    <small><strong>Parsed Constructs</strong></small>
    <figure>
        <table role="grid" class="screening-steps-table transgene-table">
            <thead>
                <tr>
                    <th>Promoter</th>
                    <th>Reporter</th>
                    <th>Role</th>
                    <th>Family</th>
                    <th>Target</th>
                    <th>Fluorophore</th>
                    <th>Spectra</th>
                </tr>
            </thead>
            <tbody>
                {% for tg in transgenes %}
                <tr title="{{ tg.construct }}">
                    <td><strong>{{ tg.promoter or "—" }}</strong></td>
                    <td>{{ tg.reporter or "—" }}</td>
                    <td>{{ tg.construct_role or "—" }}</td>
                    <td>{{ tg.family or tg.sensor_family or tg.effector_family or "—" }}</td>
                    <td>{{ tg.target or tg.sensor_target or "—" }}</td>
                    <td>{{ tg.fluorophore or "—" }}</td>
                    <td>
                        {% if tg.spectra %}
                            Ex {{ tg.spectra.ex }} / Em {{ tg.spectra.em }} nm
                        {% else %}
                            —
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </figure>
</section>
{% endif %}
