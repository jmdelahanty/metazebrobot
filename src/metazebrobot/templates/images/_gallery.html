{# Linked screening images (docs/screening_images_design.md). #}
{% if items %}
<div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));">
{% for img in items %}
    <figure style="margin:0">
        <a href="/image-links/{{ img.id }}/preview.png" target="_blank">
            <img src="/image-links/{{ img.id }}/preview.png" alt="{{ img.name }}" loading="lazy"
                 style="width:100%; border-radius:4px">
        </a>
        <figcaption><small>
            {% if img.well_label %}<strong>{{ img.well_label }}</strong>{% endif %}
            {% if img.fish_id %} · <a href="/fish/{{ img.fish_id }}/view">{{ labels.get(img.fish_id) or img.fish_id[:8] }}</a>{% endif %}
            · {{ img.kind }} · {{ img.taken_at_lab }}
            {% for c in img.channels %}<br>{{ c.fluor or c.name }}{% endfor %}
            {% for line in img.settings %}<br>{{ line }}{% endfor %}
            <br><a href="/viewer/?image_url={{ request.base_url }}image-links/{{ img.id }}/image.ome.tiff"
                   target="_blank">open in viewer</a> · <a href="/image-links/{{ img.id }}/file">download</a>
        </small></figcaption>
        <form method="post" action="/image-links/{{ img.id }}/reference" style="margin:0.25rem 0 0">
            <input type="hidden" name="return_to" value="{{ return_to or request.url.path }}">
            {% if img.is_reference %}
            <small>★ <strong>reference</strong>{% if img.reference_caption %}: {{ img.reference_caption }}{% endif %}</small>
            <button type="submit" name="action" value="unmark" class="outline secondary"
                    style="padding:0.1rem 0.4rem; font-size:0.75rem">unmark</button>
            {% else %}
            <fieldset role="group" style="margin:0">
                <input type="text" name="caption" placeholder="caption (optional)" aria-label="Reference caption"
                       style="font-size:0.75rem; padding:0.2rem 0.4rem; height:auto">
                <button type="submit" name="action" value="mark" class="outline"
                        style="padding:0.1rem 0.4rem; font-size:0.75rem">☆ reference</button>
            </fieldset>
            {% endif %}
        </form>
    </figure>
{% endfor %}
</div>
{% else %}
<p><em>No screening images linked.</em></p>
{% endif %}
<p><small><a href="/image-links/import{% if dish_id %}?folder={{ dish_id }}{% endif %}">Link screening images…</a></small></p>
