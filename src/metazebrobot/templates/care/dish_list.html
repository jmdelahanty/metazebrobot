{% extends "base.html" %}
{% block title %}Daily Care{% endblock %}

{% block content %}
<hgroup>
    <h2>Daily Care</h2>
    <p>Log feeding, water changes, and mortality for active dishes.</p>
</hgroup>

<div class="grid">
    <input type="text" id="scan-input" data-navigate="/care/" placeholder="Scan barcode or type dish ID..." autofocus>
    <a href="/dishes/new" role="button" class="outline" style="white-space:nowrap">New Dish</a>
</div>

{% if dishes %}
<figure>
<table role="grid">
    <thead>
        <tr>
            <th>Dish</th>
            <th>Genotype</th>
            <th>Fish</th>
            <th>Container</th>
            <th>Last Check</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for d in dishes %}
        <tr{% if not d.checked_today %} style="background: var(--pico-del-color)"{% endif %}>
            <td>{{ d.dish_id }}</td>
            <td>{{ d.genotype or "-" }}</td>
            {% set current = d.current_fish_count if d.current_fish_count is not none else d.fish_count %}
            <td>
                {{ current if current is not none else "-" }}
                {% if d.fish_count is not none and d.fish_count != current %}<br><small>opened at {{ d.fish_count }}</small>{% endif %}
            </td>
            <td>{{ d.container_type or "petri_dish" }}</td>
            <td>{{ d.last_check or "Never" }}</td>
            <td>
                <a href="/care/{{ d.dish_id }}" role="button" class="outline">Check</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</figure>
{% else %}
<p><em>No active dishes found.</em></p>
{% endif %}

<p><a href="/screening/">&larr; Screening</a> | <a href="/fish/">Fish</a></p>
{% endblock %}
